
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>展示</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        .flower-card {
            background-color: #377285;
            border: 2px solid #fff;
            border-radius: 10px;
            width: 200px;
            margin: 10px;
            text-align: center;
            padding: 10px;
        }
        .flower-card img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }
        .flower-card h3 {
            margin: 10px 0;
            font-size: 18px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="flower-card">
            <h3>巧克力</h3>
            <img src="article-5a53213c71b6b.jpg" alt="無意學">
        </div>
        <div class="flower-card">
            <h3>雞排</h3>
            <img src="20211123203323_7.jpg" alt="蕭偉翰">
        </div>
        <div class="flower-card">
            <h3>熱狗</h3>
            <img src="Hotdog_-_Evan_Swigart.jpg" alt="小黃">
        </div>
    </div>
</body>
</html>
