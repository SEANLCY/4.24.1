<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>九宮格圖片</title>
  <style>
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 三欄 */
      gap: 10px;
      max-width: 600px;
      margin: 40px auto;
    }

    .grid-container img {
      width: 100%;
      height: auto;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <img src="1.png" alt="圖片1">
    <img src="2.png" alt="圖片2">
    <img src="3.png" alt="圖片3">
    <img src="4.png" alt="圖片4">
    <img src="5.png" alt="圖片5">
    <img src="6.png" alt="圖片6">
    <img src="7.png" alt="圖片7">
    <img src="8.png" alt="圖片8">
    <img src="9.png" alt="圖片9">
  </div>

</body>
</html>
